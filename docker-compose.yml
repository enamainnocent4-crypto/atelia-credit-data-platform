# Atelia Crédit — Enterprise Data Platform & BI
# Services de la plateforme. Lancer avec : docker compose up -d

services:
  postgres:
    image: postgres:16
    container_name: atelia_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Les données survivent à l'arrêt du conteneur
      - pgdata:/var/lib/postgresql/data
      # Scripts exécutés une seule fois, à la toute première création de la base
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
