# Projet dbt d'Atelia Crédit : transformations raw -> staging -> intermediate -> marts
name: atelia_credit
version: "1.0.0"
profile: atelia_credit

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Hypothèses métier, documentées et modifiables en un seul endroit
  reporting_start_date: "2024-11-30"   # première fin de mois analysée
  reporting_end_date: "2026-10-31"     # date d'arrêté (dernière fin de mois)
  refinancing_spread: 0.01             # marge de refinancement au-dessus du €STR (1 point)
  write_off_days: 180                  # passage en perte au-delà de 180 jours de retard
  # Taux de provision par tranche de retard (logique inspirée d'IFRS 9, simplifiée)
  provision_rate_current: 0.01         # aucun retard
  provision_rate_1_30: 0.05            # 1 à 30 jours
  provision_rate_31_90: 0.25           # 31 à 90 jours
  provision_rate_over_90: 1.00         # plus de 90 jours (défaut)

models:
  atelia_credit:
    staging:
      # Nettoyage et typage de la donnée brute, sans calcul métier. En vues.
      +schema: staging
      +materialized: view
    intermediate:
      # Traitement des anomalies détectées au staging (dédoublonnage, quarantaine).
      +schema: intermediate
      +materialized: view
    marts:
      # Modèle en étoile lu par Power BI : des tables, rapides à interroger.
      +schema: marts
      +materialized: table

data_tests:
  atelia_credit:
    # Chaque test qui échoue enregistre les lignes fautives dans le schéma audit.
    +store_failures: true
    +schema: audit
