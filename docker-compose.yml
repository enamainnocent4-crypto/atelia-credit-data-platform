# Atelia Crédit — Enterprise Data Platform & BI
# Services de la plateforme. Lancer avec : docker compose up -d --build

services:
  postgres:
    image: postgres:16
    container_name: atelia_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      # Les données survivent à l'arrêt du conteneur
      - pgdata:/var/lib/postgresql/data
      # Scripts exécutés une seule fois, à la toute première création de la base
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    # Système bancaire central simulé (FastAPI)
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: atelia_api
    restart: unless-stopped
    environment:
      CORE_BANKING_API_KEY: ${CORE_BANKING_API_KEY}
    ports:
      - "${API_PORT:-8100}:8000"
    volumes:
      # Fichiers produits par le générateur, en lecture seule
      - ./data/generated:/data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  pgdata:
