# Projet dbt d'Atelia Crédit : transformations raw -> staging -> intermediate -> marts
name: atelia_credit
version: "1.0.0"
profile: atelia_credit

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Hypothèses métier, documentées et modifiables en un seul endroit
  refinancing_spread: 0.01        # marge de refinancement au-dessus du €STR (1 point)

models:
  atelia_credit:
    staging:
      # Nettoyage et typage de la donnée brute, sans calcul métier. En vues.
      +schema: staging
      +materialized: view
    intermediate:
      # Traitement des anomalies détectées au staging (dédoublonnage, quarantaine).
      +schema: intermediate
      +materialized: view
    marts:
      # Modèle en étoile lu par Power BI : des tables, rapides à interroger.
      +schema: marts
      +materialized: table

data_tests:
  atelia_credit:
    # Chaque test qui échoue enregistre les lignes fautives dans le schéma audit.
    +store_failures: true
    +schema: audit
